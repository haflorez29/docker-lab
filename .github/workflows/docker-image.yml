name: Docker Image CI

# triggers
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Git Semantic Version
      uses: PaulHatch/semantic-version@v4.0.3
      with:
        major_pattern: "major:"
        minor_pattern: "feat:"
        format: "${major}.${minor}.${patch}-prerelease${increment}"
      id: version
    - name: Docker login
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo "Iniciando login"
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
        echo "New version $NEW_VERSION"
        echo "Fin del login"
    - name: Docker build
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        NEW_VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "Iniciando build"
        docker build -t $DOCKER_USER/docker-graphql:$NEW_VERSION ./7.GithubActionDeployment/graphql-actions/
        docker build -t $DOCKER_USER/docker-graphql:latest ./7.GithubActionDeployment/graphql-actions/
        echo "Fin del build"
    - name: Docker push
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        NEW_VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "Iniciando push"
        docker push $DOCKER_USER/docker-graphql:$NEW_VERSION
        docker push $DOCKER_USER/docker-graphql:latest
        echo "Fin del push"
     
